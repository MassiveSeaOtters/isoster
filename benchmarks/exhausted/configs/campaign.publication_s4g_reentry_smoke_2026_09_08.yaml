# Fresh sub-minute gate before the recovered S4G publication campaign.

campaign_name: "publication_single_band_s4g_reentry_smoke_2026_09_08"
output_root: "/Volumes/galaxy/isophote/publication_single_band_round1_2026_08_28/preflight"

tools:
  isoster:
    enabled: true
    arms_file: benchmarks/exhausted/configs/isoster_arms.yaml
    select_arms: [ref_default]
  photutils:
    enabled: true
    arms_file: benchmarks/exhausted/configs/photutils_arms.yaml
    select_arms: [baseline_median]
    timeout: 900
  autoprof:
    enabled: true
    arms_file: benchmarks/exhausted/configs/autoprof_arms.yaml
    select_arms: [baseline]
    venv_python: "~/.venvs/autoprof_venv/bin/python"
    timeout: 300

isoster_harmonic_sweeps: []

datasets:
  s4g:
    enabled: true
    adapter: s4g_scenarios
    root: "/Volumes/galaxy/isophote/publication_single_band_round1_2026_08_28/mock_data/s4g"
    depths: [wide]
    redshift_tags: ["010"]
    select: ["ESO012-010/wide_z010", "NGC4050/wide_z010"]

qa:
  per_galaxy_qa: false
  cross_arm_overlay: false
  cross_tool_comparison: false
  summary_grids: false
  residual_models: false

execution:
  max_parallel_galaxies: 2
  skip_existing: true
  dry_run: false
  fail_fast: false

summary:
  per_galaxy_inventory: true
  per_tool_cross_arm_table: true
  cross_tool_table: true
