# Complete the AutoProf fixed-center record skipped by the isolated NGC1209
# recovery. Its required Isoster reference profile is regenerated alongside it.

campaign_name: "publication_single_band_huang_recovery_ngc1209_fix_center_2026_09_08"
output_root: "/Volumes/galaxy/isophote/publication_single_band_round1_2026_08_28/fits"

tools:
  isoster:
    enabled: true
    arms_file: benchmarks/exhausted/configs/isoster_arms.yaml
    select_arms: [ref_default]
  photutils:
    enabled: false
    arms_file: benchmarks/exhausted/configs/photutils_arms.yaml
  autoprof:
    enabled: true
    arms_file: benchmarks/exhausted/configs/autoprof_arms.yaml
    select_arms: [fix_center]
    venv_python: "~/.venvs/autoprof_venv/bin/python"
    timeout: 300

isoster_harmonic_sweeps: []

datasets:
  huang2013:
    enabled: true
    adapter: huang2013_scenarios
    root: "/Volumes/galaxy/isophote/publication_single_band_round1_2026_08_28/mock_data/huang2013"
    depths: [noiseless]
    redshift_tags: ["005"]
    select: ["NGC1209/noiseless_z005"]

qa:
  per_galaxy_qa: false
  cross_arm_overlay: false
  cross_tool_comparison: false
  summary_grids: false
  residual_models: false

execution:
  max_parallel_galaxies: 1
  skip_existing: true
  dry_run: false
  fail_fast: false

summary:
  per_galaxy_inventory: true
  per_tool_cross_arm_table: true
  cross_tool_table: true
