# Round-2 (PSF-convolved) Huang2013 small-sample campaign: 20 galaxies drawn at random
# (15 with seed 20261009 plus 5 with R_ref > 60 px, seed 20261010), all 9 scenarios,
# three tools, with the cubic + eccentric-anomaly sampling arms under test.
campaign_name: round2_small_sample_2026_10_10
output_root: /Volumes/galaxy/isophote/publication_single_band_round2_2026_10_10/fits
tools:
  isoster:
    enabled: true
    arms_file: benchmarks/exhausted/configs/isoster_arms.yaml
    select_arms:
    - ref_default
    - geom_ea
    - int_median
    - samp_cubic
    - samp_cubic_ea
    - samp_cubic_ea_min4
    - samp_cubic_ea_median
    - samp_cubic_ea_outer_damp
  photutils:
    enabled: true
    arms_file: benchmarks/exhausted/configs/photutils_arms.yaml
    select_arms:
    - baseline_median
    - default_bilinear
    timeout: 900
  autoprof:
    enabled: true
    arms_file: benchmarks/exhausted/configs/autoprof_arms_zero_background.yaml
    select_arms:
    - baseline
    - deep
    - fix_center
    venv_python: ~/.venvs/autoprof_venv/bin/python
    timeout: 300
isoster_harmonic_sweeps: []
datasets:
  huang2013:
    enabled: true
    adapter: huang2013_scenarios
    root: /Volumes/galaxy/isophote/publication_single_band_round2_2026_10_10/mock_data/huang2013
    depths:
    - noiseless
    - wide
    - deep
