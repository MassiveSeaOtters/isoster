site_name: Isoster Documentation
site_description: Fast isophote fitting for galaxy images.
site_author: Shuang
repo_url: https://github.com/MassiveSeaOtters/isoster
repo_name: MassiveSeaOtters/isoster

exclude_docs: |
  agent/
  publication/
  journal/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Specification: SPEC.md
  - User Guide: 01-user-guide.md
  - Configuration: 02-configuration-reference.md
  - Algorithm: 03-algorithm.md
  - Architecture: 04-architecture.md
  - Testing: 05-testing.md
  - QA Functions: 06-qa-functions.md
  - LSB Features: 07-lsb-features.md
  - Outer Regularization: 08-outer-regularization.md
  - Exhausted Benchmark: 09-exhausted-benchmark.md
  - Multi-Band: 10-multiband.md
  - QA Evaluation Refresh 2026-05-10: 11-qa-evaluation-refresh-2026-05-10.md
  - Technical Chapter:
      - "1.0 Overview": technical/1.0-overview.md
      - "1.1 Algorithmic Foundation": technical/1.1-algorithmic-foundation.md
      - "1.2 Implementation Overview": technical/1.2-implementation-overview.md
      - "1.3 Why ISOSTER is Fast": technical/1.3-why-fast.md
      - "1.4.1 Eccentric Anomaly + ISOFIT": technical/1.4.1-eccentric-anomaly-isofit.md
      - "1.4.2 Variance-Aware Fitting": technical/1.4.2-variance-aware-fitting.md
      - "1.4.3 LSB Outskirt Strategy": technical/1.4.3-lsb-outskirts.md
      - "1.4.4 Batch Robustness": technical/1.4.4-batch-robustness.md
      - "1.4.5 Multi-band Joint Fit": technical/1.4.5-multiband.md
      - "1.4.6 Diagnostics, QA, Reproducibility": technical/1.4.6-diagnostics-qa.md
      - "1.5 Comparison to Existing Tools": technical/1.5-comparison.md
      - "1.6 Limitations and Roadmap": technical/1.6-limitations-roadmap.md
  - Visual References:
      - Algorithm Walkthrough: reference/algorithm-walkthrough.md
      - Configuration Decision Tree: reference/configuration-decision-tree.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
