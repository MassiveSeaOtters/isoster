name: Publish docs site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "benchmarks/draft_timings/**"
      - "benchmarks/performance/reference_speedup.json"
      - "benchmarks/performance/check_speedup_claims.py"
      - "benchmarks/harmonic_scale/**"
      - "benchmarks/timing/**"
      - "README.md"
      - "CITATION.cff"
      - "CLAUDE.md"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gh-deploy needs full history to push to gh-pages

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync docs environment
        run: uv sync --extra docs

      - name: Check the technical chapter against the archived measurements
        # The chapter quotes timings transcribed from
        # benchmarks/draft_timings/reference_timings.json. A transcription that
        # drifts still looks measured, so fail the build rather than publish it.
        run: uv run python benchmarks/draft_timings/check_draft_numbers.py

      - name: Check the quoted photutils speedups against the archived sweep
        # The README/CLAUDE.md/CITATION.cff speedup figures are transcribed by
        # hand from benchmarks/performance/reference_speedup.json. Same
        # contract as the check above, for the one headline number that lives
        # outside the technical chapter.
        run: uv run python benchmarks/performance/check_speedup_claims.py

      - name: Check the harmonic-scale archive against its frozen tolerances
        # reference_harmonic_scale.json backs Part A's cross-tool harmonic
        # claims. The tolerances it is judged by were frozen from a pilot on a
        # disjoint seed block and committed before the validation run, so this
        # gate tests a pre-registration rather than a post-hoc fit. Needs no
        # AutoProf: it reads the committed JSON and the committed prose.
        run: uv run python benchmarks/harmonic_scale/check_harmonic_scale.py

      - name: Check the Track 2 gradient-reconstruction archives
        # A4 Track 2 decides whether an AutoProf arm may report Bender a_n/b_n
        # at all, so its two archives are gated on the same terms as the one
        # above: frozen tolerances from a disjoint pilot seed block, and a
        # licensing verdict recomputed from the archived numbers rather than
        # read off them. The tolerances additionally carry a fingerprint of the
        # claim definitions, so changing how a claim is reduced fails here
        # instead of quietly comparing two different quantities.
        run: uv run python benchmarks/harmonic_scale/check_gradient_reconstruction.py

      - name: Check the Part B Stage 1 accuracy thresholds
        # The bars deciding which timings enter a headline ratio are derived by
        # accuracy_thresholds.py and transcribed into the design spec. A
        # transcription that drifts still reads as derived, so it is gated on
        # the same terms as the archived measurements -- before Part B has
        # produced a single timing.
        run: |
          # Exercise the generator itself as well as comparing its result. A
          # stale human-readable branch once crashed while the JSON checker
          # remained green.
          uv run python benchmarks/timing/accuracy_thresholds.py --json > /dev/null
          uv run python benchmarks/timing/check_accuracy_thresholds.py

      - name: Prove the archive gates can still fail
        # A gate that has gone quiet is worse than one that fails. Both
        # harmonic-scale gates carry a self-test that corrupts an archive and
        # asserts the corruption is caught.
        run: |
          uv run python benchmarks/harmonic_scale/check_harmonic_scale.py --self-test
          uv run python benchmarks/harmonic_scale/check_gradient_reconstruction.py --self-test
          uv run python benchmarks/timing/check_accuracy_thresholds.py --self-test

      - name: Build site (strict)
        run: uv run mkdocs build --strict

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages branch
        run: uv run mkdocs gh-deploy --force --no-history
